<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác thực OTP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-body p-4">
                        <h4 class="text-center mb-3">Xác thực đăng ký</h4>
                        <p class="text-muted text-center">
                            Mã OTP đã được gửi đến email của bạn. Vui lòng nhập mã để hoàn tất đăng ký.
                        </p>

                        <!-- Form nhập OTP -->
                        <form method="POST">
                            <div class="mb-3">
                                <label for="otp" class="form-label">Mã OTP</label>
                                <input type="text" class="form-control" id="otp" name="otp"
                                       placeholder="Nhập 6 chữ số OTP" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Xác nhận</button>
                            </div>
                        </form>

                        <!-- Nút gửi lại OTP -->
                        <div class="mt-3 text-center">
                            <a href="{{ url_for('resend_otp') }}" class="btn btn-link">
                                Gửi lại mã OTP
                            </a>
                        </div>

                        {% with messages = get_flashed_messages(with_categories=true) %}
                          {% if messages %}
                            <div class="mt-3">
                              {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else category }}">
                                  {{ message }}
                                </div>
                              {% endfor %}
                            </div>
                          {% endif %}
                        {% endwith %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
